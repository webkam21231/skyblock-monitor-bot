[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skyblock-monitor-bot"
version = "0.1.0"
description = "Telegram bot that monitors Hypixel SkyBlock progress"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "aiogram>=3.20,<4",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
skyblock-monitor = "skyblock_monitor.bot:main"

[tool.hatch.build.targets.wheel]
packages = ["src/skyblock_monitor"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
